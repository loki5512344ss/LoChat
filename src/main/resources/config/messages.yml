# LoChat system messages
# Internal messages for commands, filters, moderation, and general feedback.

# ── Commands ───────────────────────────────────────────────────────────────────

commands:
  mute:
    usage: "&cUsage: &6/lmute <player> [time] [-s] [reason]"
    time-help: "&7Time format: &61d&7, &62h&7, &630m&7, &660s&7, &6perm"
    silent-help: "&7Use &6-s &7for a silent mute (needs &6lochat.mute.silent&7)"
    no-silent-permission: "&cNo permission for silent mute"
    default-reason: "No reason specified"
    default-duration: "7d"

  cooldown:
    message: "&cPlease wait &6{remaining} &cseconds"

  clear-chat:
    lines-cleared: "&fChat cleared &7({lines} lines)"
    no-permission: "&cNo permission to clear chat"

# ── Local Chat ─────────────────────────────────────────────────────────────────

local-chat:
  nobody-heard: "&7Nobody heard you. Start your message with &6! &7to be heard everywhere."
  no-players-nearby: "&7No players nearby. Start your message with &6! &7to write to everyone."

# ── Filters ────────────────────────────────────────────────────────────────────

filters:
  caps:
    min-length: 3
    blocked-message: "&cPlease don't shout"
    auto-lowercase-notice: "&7Message auto-corrected"
  spam:
    blocked-message: "&cDo not spam"
    similar-message: "&cYou already sent a similar message"
  swear:
    blocked-message: "&cInappropriate language"
    replaced-notice: "&7Some words were replaced"

# ── Mute Messages ──────────────────────────────────────────────────────────────

mute:
  muted-message: "&cYou are muted! &7Reason: &6{reason}&7. Remaining: &6{time}"
  muted-permanent: "&cYou are permanently muted! &7Reason: &6{reason}"
  player-muted: "&fPlayer &6{player} &fmuted for &6{time}&f. Reason: &7{reason}"
  player-muted-permanent: "&fPlayer &6{player} &fmuted permanently. Reason: &7{reason}"
  player-muted-silent: "&8[&7SILENT&8] &6{player} &7muted for &6{time}"
  player-unmuted: "&fPlayer &6{player} &funmuted"
  not-muted: "&7Player &6{player} &7is not muted"
  player-not-found: "&cPlayer not found!"
  invalid-time: "&cInvalid time format!"
  already-muted: "&cPlayer is already muted!"
  no-silent-unmute-permission: "&cNo permission for silent unmute"

# ── Gamemodes ──────────────────────────────────────────────────────────────────

gamemodes:
  survival: "Survival"
  creative: "Creative"
  adventure: "Adventure"
  spectator: "Spectator"

# ── Private Messages ───────────────────────────────────────────────────────────

private-messages:
  no-reply-target: "&cNobody to reply to"
  message-sent: "&fMessage sent to &6{player}"
  player-offline: "&cPlayer &6{player} &cis not online"
  cannot-message-self: "&cYou cannot message yourself"

# ── Ignore ─────────────────────────────────────────────────────────────────────

ignore:
  player-ignored: "&fPlayer &6{player} &fis now ignored"
  player-unignored: "&fPlayer &6{player} &fis no longer ignored"
  already-ignored: "&7Player &6{player} &7is already ignored"
  not-ignored: "&7Player &6{player} &7is not ignored"
  cannot-ignore-self: "&cYou cannot ignore yourself"
  ignore-list-empty: "&7Your ignore list is empty"
  ignore-list-header: "&7Ignored players:"

# ── General ────────────────────────────────────────────────────────────────────

general:
  no-permission: "&cNo permission!"
  player-only: "&cPlayers only!"
  invalid-arguments: "&cInvalid arguments!"
  command-disabled: "&cCommand disabled!"
  feature-disabled: "&cFeature disabled!"
  player-not-found: "&cPlayer not found!"
  time-formats:
    seconds: "s"
    minutes: "m"
    hours: "h"
    days: "d"
    permanent: "permanent"
  enabled: "&aEnabled"
  disabled: "&cDisabled"
  online: "&aOnline"
  offline: "&7Offline"

# ── Moderation ─────────────────────────────────────────────────────────────────

moderation:
  default-reason: "No reason specified"
  duration-permanent: "permanent"
